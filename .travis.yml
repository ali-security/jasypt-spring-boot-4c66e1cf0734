dist: trusty
language: java
jdk:
  - openjdk8
  - openjdk11
  - openjdk12
before_install:
  - |
    case "$TRAVIS_JDK_VERSION" in
      openjdk8) ZULU=zulu8.98.0.201-ca-jdk8.0.514-linux_x64 ;;
      openjdk12) ZULU=zulu12.3.11-ca-jdk12.0.2-linux_x64 ;;
      *) ZULU= ;;
    esac
    if [ -n "$ZULU" ]; then
      curl -fsSL "https://cdn.azul.com/zulu/bin/$ZULU.tar.gz" | tar xz -C "$HOME"
      export JAVA_HOME="$HOME/$ZULU"
      export PATH="$JAVA_HOME/bin:$PATH"
    fi
  - java -version
install: mvn package -Dgpg.skip=true
